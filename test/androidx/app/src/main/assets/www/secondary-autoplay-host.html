<!doctype html>
<meta charset="utf-8">
<title>WAIT secondary autoplay</title>
<pre id="results"></pre>
<script src="cordova.js"></script>
<script>
document.addEventListener('deviceready', async function () {
    const api = cordova.secondaryWebView;
    const mode = new URL(location.href).searchParams.get('mode') || 'shared';
    const base = {url: 'www/secondary-autoplay.html', processIsolation: mode, zOrder: mode === 'isolated' ? 'below' : 'above'};
    if (cordova.platformId === 'android' && mode === 'isolated') base.unsafeAllowIsolatedBelowApi33 = true;
    const results = document.getElementById('results');
    const failures = [];
    function check(ok, message) { if (!ok) failures.push(message); }
    try {
        for (const invalid of ['true', 1, null, {}, []]) {
            let code;
            try { await api.create(Object.assign({}, base, {allowMediaAutoplay: invalid})); }
            catch (error) { code = error.code; }
            check(code === 'INVALID_CONFIG', 'Invalid boolean accepted: ' + JSON.stringify(invalid) + ' (' + code + ')');
        }
        for (const option of [undefined, false, true]) {
            const config = Object.assign({}, base);
            if (option !== undefined) config.allowMediaAutoplay = option;
            let unsubscribe;
            let timer;
            const report = new Promise((resolve, reject) => {
                timer = setTimeout(() => reject(new Error('No media report')), 15000);
                unsubscribe = api.onEvent(event => {
                    if (event.type === 'message' && event.detail.name === 'autoplayResult') resolve(event.detail.payload);
                    if (event.type === 'loadFailed') reject(new Error(JSON.stringify(event.detail)));
                });
            });
            // Attach rejection handling while create is pending.
            report.catch(() => {});
            let state;
            try { await api.create(config); state = await report; }
            finally { clearTimeout(timer); unsubscribe(); await api.destroy(); }
            results.textContent += (option === undefined ? 'native default' : 'allowMediaAutoplay=' + option) + ': ' + JSON.stringify(state) + '\n';
            check(state.audioError === null, 'Audio fixture decode error');
            if (option === true) {
                check(state.contextState === 'running' && state.contextAdvanced, 'Web Audio did not start');
                check(state.audioPlaying && state.audioAdvanced, 'HTML audio did not autoplay');
            } else {
                if (cordova.platformId === 'android') {
                    check(state.contextState === 'running' && state.contextAdvanced, 'Android native Web Audio default should run');
                } else {
                    check(state.contextState === 'suspended' && !state.contextAdvanced, 'iOS native Web Audio default should require a gesture');
                }
                check(!state.audioPlaying && !state.audioAdvanced, 'HTML audio started without permission');
            }
        }
        if (failures.length) throw new Error(failures.join('; '));
        document.title = 'PASS secondary autoplay';
    } catch (error) {
        results.textContent += String(error);
        document.title = 'FAIL secondary autoplay';
        await api.destroy().catch(() => {});
    }
}, {once: true});
</script>
