<!doctype html>
<meta charset="utf-8">
<title>Secondary media autoplay</title>
<audio id="audio" autoplay loop></audio>
<script>
// Start both APIs at load, without resume(), play(), or a user gesture.
const context = new (window.AudioContext || window.webkitAudioContext)();
const buffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
const samples = buffer.getChannelData(0);
for (let i = 0; i < samples.length; i++) samples[i] = 0.01 * Math.sin(2 * Math.PI * 440 * i / context.sampleRate);
const source = context.createBufferSource();
source.buffer = buffer;
source.loop = true;
source.connect(context.destination);
source.start();
// A self-contained, non-silent PCM WAV also avoids scheme-handler range support.
const rate = 8000;
const wav = new ArrayBuffer(44 + rate * 2);
const view = new DataView(wav);
function text(offset, value) { for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i)); }
text(0, 'RIFF'); view.setUint32(4, wav.byteLength - 8, true); text(8, 'WAVE');
text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
view.setUint16(32, 2, true); view.setUint16(34, 16, true); text(36, 'data'); view.setUint32(40, rate * 2, true);
for (let i = 0; i < rate; i++) view.setInt16(44 + i * 2, 300 * Math.sin(2 * Math.PI * 440 * i / rate), true);
const audio = document.getElementById('audio');
audio.src = URL.createObjectURL(new Blob([wav], {type: 'audio/wav'}));
let playing = false;
audio.addEventListener('playing', () => { playing = true; });
const start = context.currentTime;
setTimeout(() => {
    secondaryWebView.post('autoplayResult', {
        contextState: context.state,
        contextAdvanced: context.currentTime > start,
        audioPlaying: playing && !audio.paused,
        audioAdvanced: audio.currentTime > 0,
        audioReady: audio.readyState >= 2,
        audioError: audio.error ? audio.error.code : null
    });
}, 2500);
</script>
